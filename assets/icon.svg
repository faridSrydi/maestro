<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Royal Cobalt Blue Gradient -->
    <linearGradient id="blueLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3bc7" />
      <stop offset="100%" stop-color="#1455f5" />
    </linearGradient>

    <!-- Electric Cyan Wave Gradient -->
    <linearGradient id="cyanWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Crisp Ice White Gradient -->
    <linearGradient id="whiteLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background Pill -->
  <rect width="400" height="240" rx="48" fill="#08090f" />

  <g transform="translate(40, 20)" filter="url(#logoGlow)">
    <!-- 1. Left Royal Blue Loop -->
    <path d="M120,40 C65,40 20,76 20,120 C20,164 65,200 120,200 C155,200 178,175 200,140 C175,100 155,40 120,40 Z" fill="url(#blueLoop)" />
    <!-- Left Inner Hole -->
    <circle cx="115" cy="120" r="42" fill="#08090f" />

    <!-- 2. Right Pure Ice White Loop -->
    <path d="M200,100 C222,65 245,40 280,40 C335,40 380,76 380,120 C380,164 335,200 280,200 C240,200 215,165 190,130 C205,170 170,210 130,215 C175,205 200,170 215,140 Z" fill="url(#whiteLoop)" />
    <!-- Right Inner Hole -->
    <circle cx="285" cy="120" r="42" fill="#08090f" />

    <!-- 3. Dynamic Center Electric Cyan Wave Ribbon -->
    <path d="M135,160 C160,160 185,135 205,105 C225,75 250,55 285,55 C260,65 240,90 220,120 C200,150 175,175 140,175 Z" fill="url(#cyanWave)" />
    <path d="M165,110 C185,85 205,70 230,65 C210,80 190,105 175,135 Z" fill="#00f0ff" opacity="0.8" />
  </g>
</svg>
